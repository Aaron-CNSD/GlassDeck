name: GlassDeck
options:
  bundleIdPrefix: com.glassdeck
  deploymentTarget:
    macOS: "14.0"
targets:
  Shared:
    type: framework
    platform: macOS
    sources:
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassdeck.shared
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  GlassDeckWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassdeck.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: GlassDeck Widget
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: Widget/GlassDeckWidget.entitlements
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: GlassDeckWidget
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  GlassDeck:
    type: application
    platform: macOS
    sources:
      - Sources/GlassDeck
    dependencies:
      - target: Shared
      - target: GlassDeckWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassdeck.app
        INFOPLIST_KEY_CFBundleDisplayName: GlassDeck
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    postBuildScripts:
      - name: Bundle Offline Workspace
        script: |
          bash "$SRCROOT/tools/bundle-workspace.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Workspace"
      - name: Copy App Icon
        script: |
          ICON="$SRCROOT/Resources/AppIcon.icns"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppIcon.icns"
          if [ -f "$ICON" ]; then
            mkdir -p "$(dirname "$DEST")"
            cp "$ICON" "$DEST"
          else
            echo "warning: AppIcon.icns not found at $ICON"
          fi
    info:
      path: Sources/GlassDeck/Info.plist
      properties:
        CFBundleDisplayName: Glass Deck
        CFBundleName: Glass Deck
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "MIT License"
        NSAppleEventsUsageDescription: "Glass Deck controls Finder and System Events to flip your system switches (dark mode, mute, empty trash)."
        CFBundleLocalizations:
          - en
          - zh-Hans
          - zh-Hant
          - ja
          - ko
