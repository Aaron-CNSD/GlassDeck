name: GlassDeck
options:
  bundleIdPrefix: com.glassdeck
  deploymentTarget:
    macOS: "14.0"
targets:
  Shared:
    type: framework
    platform: macOS
    sources:
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassdeck.shared
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  GlassDeck:
    type: application
    platform: macOS
    sources:
      - Sources/GlassDeck
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassdeck.app
        INFOPLIST_KEY_CFBundleDisplayName: GlassDeck
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    info:
      path: Sources/GlassDeck/Info.plist
      properties:
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "MIT License"

  GlassDeckWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassdeck.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: GlassDeck Widget
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: GlassDeckWidget
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
